<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Dark MoneyPod Expense Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Tesseract.js (OCR สำหรับแสกนสลิป) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <!-- Google Identity Services API (OAuth 2.0) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .privacy-masked {
            filter: blur(5px);
            user-select: none;
        }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- Header Navigation -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-wallet text-pink-500 text-2xl"></i>
                <h1 class="text-xl font-bold bg-gradient-to-r from-pink-500 to-purple-500 bg-clip-text text-transparent">
                    MoneyPod Tracker
                </h1>
            </div>
            
            <div class="flex items-center gap-3">
                <!-- Privacy Mode Toggle -->
                <button id="togglePrivacyBtn" onclick="togglePrivacy()" class="p-2 bg-slate-800 rounded-full hover:bg-slate-700 text-slate-300">
                    <i id="privacyIcon" class="fa-solid fa-eye"></i>
                </button>
                <!-- Lock PIN Button -->
                <button onclick="lockApp()" class="p-2 bg-slate-800 rounded-full hover:bg-slate-700 text-slate-300">
                    <i class="fa-solid fa-lock"></i>
                </button>
                <!-- Google Sign-In Container -->
                <div id="g_id_onload"
                     data-client_id="193914963755-bve94pbiuo0n7jr42n5s431j7vcu1bbf.apps.googleusercontent.com"
                     data-callback="handleCredentialResponse"
                     data-auto_prompt="false">
                </div>
                <div class="g_id_signin" data-type="icon" data-shape="circle" data-theme="dark"></div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-4xl mx-auto p-4 space-y-6">

        <!-- Dashboard / Balance Overview -->
        <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-slate-800/80 border border-slate-700 p-5 rounded-2xl shadow-lg">
                <p class="text-sm text-slate-400">ยอดยกมาทั้งหมด (Total Balance)</p>
                <p id="totalBalance" class="text-3xl font-bold text-emerald-400 mt-2 privacy-target">฿0.00</p>
            </div>
            <div class="bg-slate-800/80 border border-slate-700 p-5 rounded-2xl shadow-lg">
                <p class="text-sm text-slate-400">รายรับเดือนนี้ (Income)</p>
                <p id="totalIncome" class="text-2xl font-semibold text-blue-400 mt-2 privacy-target">฿0.00</p>
            </div>
            <div class="bg-slate-800/80 border border-slate-700 p-5 rounded-2xl shadow-lg">
                <p class="text-sm text-slate-400">รายจ่ายเดือนนี้ (Expense)</p>
                <p id="totalExpense" class="text-2xl font-semibold text-rose-400 mt-2 privacy-target">฿0.00</p>
            </div>
        </section>

        <!-- OCR Slip Scanner Section -->
        <section class="bg-slate-800/50 border border-slate-700/80 p-5 rounded-2xl">
            <h2 class="text-lg font-semibold mb-3 flex items-center gap-2 text-purple-300">
                <i class="fa-solid fa-qrcode"></i> แสกนสลิปโอนเงิน (OCR Scanner)
            </h2>
            <div class="flex flex-col sm:flex-row items-center gap-4">
                <input type="file" id="slipInput" accept="image/*" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-purple-600 file:text-white hover:file:bg-purple-700 cursor-pointer"/>
                <button onclick="processSlip()" class="w-full sm:w-auto px-6 py-2 bg-purple-600 hover:bg-purple-500 rounded-xl font-medium text-white transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> อ่านข้อมูลสลิป
                </button>
            </div>
            <p id="ocrStatus" class="text-xs text-slate-400 mt-2 hidden"></p>
        </section>

        <!-- Transaction Form -->
        <section class="bg-slate-800/80 border border-slate-700 p-5 rounded-2xl space-y-4">
            <h2 class="text-lg font-semibold text-pink-400 flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square"></i> บันทึกรายการใหม่
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                <select id="txType" class="bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-slate-200">
                    <option value="expense">รายจ่าย (Expense)</option>
                    <option value="income">รายรับ (Income)</option>
                    <option value="transfer">โอนระหว่างกระเป๋า</option>
                    <option value="borrow">ยืม / คืนเงิน</option>
                </select>
                <input type="text" id="txTitle" placeholder="ชื่อรายการ" class="bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-slate-200">
                <input type="number" id="txAmount" placeholder="จำนวนเงิน" class="bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-slate-200">
                <button onclick="addTransaction()" class="bg-pink-600 hover:bg-pink-500 text-white rounded-xl font-medium p-2.5 transition">
                    + เพิ่มรายการ
                </button>
            </div>
        </section>

        <!-- Transaction History -->
        <section class="bg-slate-800/80 border border-slate-700 p-5 rounded-2xl">
            <h2 class="text-lg font-semibold mb-4 text-slate-200 flex items-center gap-2">
                <i class="fa-solid fa-list-check"></i> ประวัติรายการล่าสุด
            </h2>
            <div id="txList" class="space-y-3">
                <p class="text-center text-slate-500 py-4">ยังไม่มีรายการที่บันทึก</p>
            </div>
        </section>

    </main>

    <!-- JavaScript App Logic -->
    <script>
        let isPrivacyMode = false;
        let transactions = JSON.parse(localStorage.getItem('mp_transactions')) || [];

        // Google OAuth Callback Handler
        function handleCredentialResponse(response) {
            // ดึงข้อมูล JWT Token
            const responsePayload = parseJwt(response.credential);
            alert(`เข้าสู่ระบบสำเร็จ! ต้อนรับคุณ ${responsePayload.name}`);
            console.log("Logged in User:", responsePayload);
        }

        function parseJwt(token) {
            let base64Url = token.split('.')[1];
            let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            let jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // Privacy Mode Toggle
        function togglePrivacy() {
            isPrivacyMode = !isPrivacyMode;
            const elements = document.querySelectorAll('.privacy-target');
            const icon = document.getElementById('privacyIcon');
            
            elements.forEach(el => {
                if (isPrivacyMode) {
                    el.classList.add('privacy-masked');
                } else {
                    el.classList.remove('privacy-masked');
                }
            });

            icon.className = isPrivacyMode ? 'fa-solid fa-eye-slash text-pink-400' : 'fa-solid fa-eye';
        }

        // Lock App Function
        function lockApp() {
            alert('ล็อกแอปพลิเคชันเรียบร้อยแล้ว');
        }

        // Simple OCR Process
        async function processSlip() {
            const fileInput = document.getElementById('slipInput');
            const status = document.getElementById('ocrStatus');
            
            if (!fileInput.files[0]) {
                alert('กรุณาเลือกไฟล์สลิปก่อนครับ');
                return;
            }

            status.classList.remove('hidden');
            status.innerText = 'กำลังประมวลผลข้อความจากสลิป...';

            try {
                const worker = await Tesseract.createWorker('tha+eng');
                const ret = await worker.recognize(fileInput.files[0]);
                status.innerText = 'อ่านข้อมูลสำเร็จ!';
                
                // ตรวจหาจำนวนเงินเบื้องต้น
                const text = ret.data.text;
                const amountMatch = text.match(/([0-9,]+\.[0-9]{2})/);
                if (amountMatch) {
                    document.getElementById('txAmount').value = amountMatch[1].replace(',', '');
                    document.getElementById('txTitle').value = 'รายการจากสลิป';
                }
                await worker.terminate();
            } catch (err) {
                status.innerText = 'เกิดข้อผิดพลาดในการอ่านสลิป';
                console.error(err);
            }
        }

        // Add Transaction
        function addTransaction() {
            const title = document.getElementById('txTitle').value;
            const amount = parseFloat(document.getElementById('txAmount').value);
            const type = document.getElementById('txType').value;

            if (!title || isNaN(amount)) {
                alert('กรุณากรอกข้อมูลให้ครบถ้วน');
                return;
            }

            const newTx = { id: Date.now(), title, amount, type, date: new Date().toLocaleDateString('th-TH') };
            transactions.unshift(newTx);
            localStorage.setItem('mp_transactions', JSON.stringify(transactions));
            
            // Clear Inputs
            document.getElementById('txTitle').value = '';
            document.getElementById('txAmount').value = '';
            
            renderTransactions();
        }

        // Render UI
        function renderTransactions() {
            const listEl = document.getElementById('txList');
            let totalInc = 0;
            let totalExp = 0;

            if (transactions.length === 0) {
                listEl.innerHTML = `<p class="text-center text-slate-500 py-4">ยังไม่มีรายการที่บันทึก</p>`;
            } else {
                listEl.innerHTML = transactions.map(tx => {
                    if (tx.type === 'income') totalInc += tx.amount;
                    if (tx.type === 'expense') totalExp += tx.amount;

                    const color = tx.type === 'income' ? 'text-emerald-400' : 'text-rose-400';
                    const sign = tx.type === 'income' ? '+' : '-';

                    return `
                        <div class="flex justify-between items-center bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                            <div>
                                <p class="font-medium text-slate-200">${tx.title}</p>
                                <p class="text-xs text-slate-500">${tx.date}</p>
                            </div>
                            <span class="font-bold ${color} privacy-target ${isPrivacyMode ? 'privacy-masked' : ''}">
                                ${sign}฿${tx.amount.toLocaleString()}
                            </span>
                        </div>
                    `;
                }).join('');
            }

            document.getElementById('totalIncome').innerText = `฿${totalInc.toLocaleString()}`;
            document.getElementById('totalExpense').innerText = `฿${totalExp.toLocaleString()}`;
            document.getElementById('totalBalance').innerText = `฿${(totalInc - totalExp).toLocaleString()}`;
        }

        // Init
        renderTransactions();
    </script>
</body>
</html>

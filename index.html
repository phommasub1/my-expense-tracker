<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Expense Tracker</title>
    
    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ExpenseApp">
    
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Tesseract OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Mitr:wght@300;400;500;600&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0B0F19',
                        darkCard: '#151C2C',
                        darkAccent: '#1E293B',
                        neonPink: '#FF2E93',
                        neonPurple: '#A855F7',
                        neonCyan: '#00F0FF',
                        neonGreen: '#10B981',
                        neonYellow: '#F59E0B',
                        neonRed: '#EF4444'
                    },
                    fontFamily: {
                        kanit: ['Kanit', 'sans-serif'],
                        mitr: ['Mitr', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #0B0F19;
            color: #F8FAFC;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            padding-top: max(16px, env(safe-area-inset-top)) !important;
        }
        .glass-card {
            background: rgba(21, 28, 44, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .neon-glow-pink { box-shadow: 0 0 15px rgba(255, 46, 147, 0.35); }
        .neon-glow-cyan { box-shadow: 0 0 15px rgba(0, 240, 255, 0.35); }
        .neon-glow-purple { box-shadow: 0 0 15px rgba(168, 85, 247, 0.35); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .blur-amount { filter: blur(8px); transition: filter 0.2s ease; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .pt-safe { padding-top: max(16px, env(safe-area-inset-top, 20px)); }
        
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            opacity: 0.7;
            cursor: pointer;
        }
    </style>
</head>
<body class="dark bg-darkBg min-h-screen text-slate-100 flex flex-col justify-between overflow-x-hidden antialiased">

    <!-- App Lock Overlay -->
    <div id="lockScreen" class="fixed inset-0 z-50 bg-darkBg/95 backdrop-blur-xl flex flex-col items-center justify-center p-6 transition-all duration-300">
        <div class="w-20 h-20 rounded-full bg-gradient-to-tr from-neonPink to-neonPurple flex items-center justify-center text-3xl text-white mb-6 neon-glow-pink animate-bounce">
            <i class="fa-solid fa-lock"></i>
        </div>
        <h2 class="text-2xl font-bold font-mitr mb-2 bg-clip-text text-transparent bg-gradient-to-r from-neonCyan to-neonPurple">ยินดีต้อนรับกลับมา</h2>
        <p class="text-slate-400 text-sm mb-6">กรุณาใส่รหัส PIN เพื่อเข้าใช้งาน (เริ่มต้น: 1234)</p>
        
        <div class="flex gap-4 mb-8">
            <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-600 transition-all"></div>
            <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-600 transition-all"></div>
            <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-600 transition-all"></div>
            <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-600 transition-all"></div>
        </div>

        <div class="grid grid-cols-3 gap-6 w-64 text-center">
            <button onclick="pressPin('1')" class="w-16 h-16 rounded-full glass-card text-xl font-bold active:scale-95 transition">1</button>
            <button onclick="pressPin('2')" class="w-16 h-16 rounded-full glass-card text-xl font-bold active:scale-95 transition">2</button>
            <button onclick="pressPin('3')" class="w-16 h-16 rounded-full glass-card text-xl font-bold active:scale-95 transition">3</button>
            <button onclick="pressPin('4')" class="w-16 h-16 rounded-full glass-card text-xl font-bold active:scale-95 transition">4</button>
            <button onclick="pressPin('5')" class="w-16 h-16 rounded-full glass-card text-xl font-bold active:scale-95 transition">5</button>
            <button onclick="pressPin('6')" class="w-16 h-16 rounded-full glass-card text-xl font-bold active:scale-95 transition">6</button>
            <button onclick="pressPin('7')" class="w-16 h-16 rounded-full glass-card text-xl font-bold active:scale-95 transition">7</button>
            <button onclick="pressPin('8')" class="w-16 h-16 rounded-full glass-card text-xl font-bold active:scale-95 transition">8</button>
            <button onclick="pressPin('9')" class="w-16 h-16 rounded-full glass-card text-xl font-bold active:scale-95 transition">9</button>
            <button onclick="triggerFaceID()" class="w-16 h-16 rounded-full glass-card text-neonCyan text-xl flex items-center justify-center active:scale-95 transition">
                <i class="fa-solid fa-face-smile"></i>
            </button>
            <button onclick="pressPin('0')" class="w-16 h-16 rounded-full glass-card text-xl font-bold active:scale-95 transition">0</button>
            <button onclick="clearPin()" class="w-16 h-16 rounded-full glass-card text-neonPink text-xl flex items-center justify-center active:scale-95 transition">
                <i class="fa-solid fa-delete-left"></i>
            </button>
        </div>
    </div>

    <!-- Header Navigation Bar -->
    <header class="pt-safe px-5 py-4 flex items-center justify-between sticky top-0 z-30 glass-card rounded-b-2xl border-b border-slate-800/50">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-neonPink via-neonPurple to-neonCyan flex items-center justify-center text-white text-lg font-bold neon-glow-pink">
                <i class="fa-solid fa-wallet"></i>
            </div>
            <div>
                <h1 class="text-base font-bold font-mitr leading-none bg-clip-text text-transparent bg-gradient-to-r from-pink-400 to-purple-400">Expense Cutie</h1>
                <p class="text-[10px] text-slate-400 mt-0.5">บันทึกรายรับ-รายจ่าย</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="togglePrivacyMode()" class="w-9 h-9 rounded-full glass-card flex items-center justify-center text-slate-300 hover:text-white active:scale-90 transition">
                <i id="privacyIcon" class="fa-solid fa-eye"></i>
            </button>
            <button onclick="openSettingsModal()" class="w-9 h-9 rounded-full glass-card flex items-center justify-center text-slate-300 hover:text-white active:scale-90 transition">
                <i class="fa-solid fa-gear"></i>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 px-4 py-4 mb-24 max-w-md mx-auto w-full space-y-5">
        <!-- PAGE 1: HOME PAGE -->
        <section id="pageHome" class="space-y-5">
            <div class="glass-card rounded-3xl p-5 relative overflow-hidden border border-slate-700/50">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-mitr text-slate-400 flex items-center gap-1.5">
                        <i class="fa-regular fa-calendar-check text-neonCyan"></i> สรุปปี <span id="currentYearDisplay">2026</span>
                    </span>
                    <span id="savingsRateBadge" class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-neonGreen/20 text-neonGreen border border-neonGreen/30">
                        ออมได้ 0%
                    </span>
                </div>

                <div class="grid grid-cols-3 gap-2 text-center mt-3">
                    <div class="p-2.5 rounded-2xl bg-darkBg/60 border border-slate-800">
                        <p class="text-[10px] text-slate-400 mb-0.5">รายรับรวม</p>
                        <p id="totalYearIncome" class="text-xs font-bold text-neonGreen privacy-target">฿0</p>
                    </div>
                    <div class="p-2.5 rounded-2xl bg-darkBg/60 border border-slate-800">
                        <p class="text-[10px] text-slate-400 mb-0.5">รายจ่ายรวม</p>
                        <p id="totalYearExpense" class="text-xs font-bold text-neonPink privacy-target">฿0</p>
                    </div>
                    <div class="p-2.5 rounded-2xl bg-darkBg/60 border border-slate-800">
                        <p class="text-[10px] text-slate-400 mb-0.5">เงินออมรวม</p>
                        <p id="totalYearSavings" class="text-xs font-bold text-neonCyan privacy-target">฿0</p>
                    </div>
                </div>

                <button onclick="openAddTransactionModal('today')" class="w-full mt-4 py-3 rounded-2xl bg-gradient-to-r from-neonPink via-neonPurple to-neonCyan text-white font-bold text-sm shadow-lg neon-glow-pink active:scale-[0.98] transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-circle-plus text-lg"></i> บันทึกรายการวันนี้
                </button>
            </div>

            <!-- Recent Transactions -->
            <div class="space-y-3">
                <div class="flex justify-between items-center">
                    <h3 class="text-sm font-bold font-mitr text-slate-300">รายการล่าสุด</h3>
                </div>
                <div id="recentTransactionList" class="space-y-2.5">
                    <p class="text-center text-slate-500 text-xs py-4">ยังไม่มีรายการบันทึก</p>
                </div>
            </div>
        </section>

        <!-- PAGE 2: SUMMARY -->
        <section id="pageSummary" class="space-y-5 hidden">
            <div class="glass-card rounded-2xl p-4 text-center">
                <h3 class="text-sm font-bold text-slate-300">หน้ารายงานสรุปผล</h3>
            </div>
        </section>

        <!-- PAGE 3: LOANS -->
        <section id="pageLoans" class="space-y-4 hidden">
            <div class="glass-card rounded-2xl p-4 text-center">
                <h3 class="text-sm font-bold text-slate-300">หน้ารายการยืม-คืนเงิน</h3>
            </div>
        </section>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 z-30 glass-card rounded-t-3xl border-t border-slate-800/80 pb-safe">
        <div class="max-w-md mx-auto flex justify-around items-center h-16 px-4">
            <button onclick="switchPage('home')" id="navHome" class="flex flex-col items-center gap-1 text-neonPink transition">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] font-mitr">หน้าหลัก</span>
            </button>
            <button onclick="switchPage('summary')" id="navSummary" class="flex flex-col items-center gap-1 text-slate-500 hover:text-slate-300 transition">
                <i class="fa-solid fa-chart-simple text-lg"></i>
                <span class="text-[10px] font-mitr">สรุปผล</span>
            </button>
            <button onclick="switchPage('loans')" id="navLoans" class="flex flex-col items-center gap-1 text-slate-500 hover:text-slate-300 transition">
                <i class="fa-solid fa-handshake-angle text-lg"></i>
                <span class="text-[10px] font-mitr">ยืม-คืนเงิน</span>
            </button>
        </div>
    </nav>

    <!-- MODAL: ADD TRANSACTION -->
    <div id="addTransactionModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-end sm:items-center justify-center hidden">
        <div class="glass-card w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 space-y-4 border border-slate-700">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-base font-mitr text-slate-200">บันทึกรายการ</h3>
                <button onclick="closeModal('addTransactionModal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div>
                <label class="text-[11px] text-slate-400 mb-1 block">จำนวนเงิน (บาท)</label>
                <input type="number" id="txAmount" placeholder="0.00" class="w-full bg-darkBg border border-slate-700 rounded-xl p-3 text-lg font-bold text-neonCyan focus:outline-none">
            </div>
            <div>
                <label class="text-[11px] text-slate-400 mb-1 block">รายการ</label>
                <input type="text" id="txTitle" placeholder="เช่น ค่าอาหาร" class="w-full bg-darkBg border border-slate-700 rounded-xl p-2.5 text-xs text-slate-200 focus:outline-none">
            </div>
            <button onclick="saveTransaction()" class="w-full py-3 rounded-2xl bg-gradient-to-r from-neonPink to-neonPurple text-white font-bold text-sm shadow-lg active:scale-95 transition">
                บันทึก
            </button>
        </div>
    </div>

    <!-- JavaScript Engine -->
    <script>
        let currentPin = "";
        const correctPin = "1234";

        function pressPin(num) {
            if (currentPin.length < 4) {
                currentPin += num;
                updatePinDots();
                if (currentPin.length === 4) {
                    setTimeout(checkPin, 150);
                }
            }
        }

        function clearPin() {
            currentPin = "";
            updatePinDots();
        }

        function updatePinDots() {
            const dots = document.querySelectorAll('.pin-dot');
            dots.forEach((dot, index) => {
                if (index < currentPin.length) {
                    dot.classList.add('bg-neonPink', 'border-neonPink');
                    dot.classList.remove('border-slate-600');
                } else {
                    dot.classList.remove('bg-neonPink', 'border-neonPink');
                    dot.classList.add('border-slate-600');
                }
            });
        }

        function checkPin() {
            if (currentPin === correctPin) {
                document.getElementById('lockScreen').style.display = 'none';
                currentPin = "";
                updatePinDots();
            } else {
                alert("รหัส PIN ไม่ถูกต้อง (เริ่มต้นคือ 1234)");
                clearPin();
            }
        }

        function triggerFaceID() {
            alert("สแกนใบหน้าสำเร็จ");
            document.getElementById('lockScreen').style.display = 'none';
        }

        function switchPage(page) {
            document.getElementById('pageHome').classList.add('hidden');
            document.getElementById('pageSummary').classList.add('hidden');
            document.getElementById('pageLoans').classList.add('hidden');

            document.getElementById('navHome').className = "flex flex-col items-center gap-1 text-slate-500 hover:text-slate-300 transition";
            document.getElementById('navSummary').className = "flex flex-col items-center gap-1 text-slate-500 hover:text-slate-300 transition";
            document.getElementById('navLoans').className = "flex flex-col items-center gap-1 text-slate-500 hover:text-slate-300 transition";

            if (page === 'home') {
                document.getElementById('pageHome').classList.remove('hidden');
                document.getElementById('navHome').className = "flex flex-col items-center gap-1 text-neonPink transition";
            } else if (page === 'summary') {
                document.getElementById('pageSummary').classList.remove('hidden');
                document.getElementById('navSummary').className = "flex flex-col items-center gap-1 text-neonPurple transition";
            } else if (page === 'loans') {
                document.getElementById('pageLoans').classList.remove('hidden');
                document.getElementById('navLoans').className = "flex flex-col items-center gap-1 text-neonCyan transition";
            }
        }

        function togglePrivacyMode() {
            const targets = document.querySelectorAll('.privacy-target');
            const icon = document.getElementById('privacyIcon');
            targets.forEach(el => el.classList.toggle('blur-amount'));
            if (icon.classList.contains('fa-eye')) {
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function openAddTransactionModal() {
            document.getElementById('addTransactionModal').classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function saveTransaction() {
            alert("บันทึกรายการเรียบร้อย!");
            closeModal('addTransactionModal');
        }

        function openSettingsModal() {
            alert("เมนูตั้งค่า");
        }
    </script>
</body>
</html>
